<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur CAR - WinDiag</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            display: flex;
            min-height: 600px;
        }

        .sidebar {
            width: 250px;
            background: #f9f9f9;
            border-right: 1px solid #e0e0e0;
            padding: 20px;
            overflow-y: auto;
        }

        .sidebar h3 {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 12px;
            margin-top: 20px;
        }

        .sidebar h3:first-child {
            margin-top: 0;
        }

        .template-select, .save-input, select {
            width: 100%;
            padding: 8px;
            margin-bottom: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
        }

        .diagnostic-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 15px;
        }

        .diagnostic-btn {
            padding: 10px;
            border: 2px solid transparent;
            border-radius: 4px;
            background: white;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s;
            text-align: center;
        }

        .diagnostic-btn:hover {
            border-color: #ddd;
        }

        .diagnostic-btn.active {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }

        .brouillons-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .brouillon-item {
            background: white;
            padding: 10px;
            margin-bottom: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .brouillon-item:hover {
            background: #f0f0f0;
            border-color: #667eea;
        }

        .brouillon-item.titre {
            font-weight: 500;
            color: #333;
        }

        .brouillon-item.date {
            font-size: 11px;
            color: #999;
            margin-top: 3px;
        }

        .brouillon-item.type {
            font-size: 11px;
            color: #667eea;
            margin-top: 2px;
        }

        .btn-delete {
            float: right;
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            cursor: pointer;
        }

        .btn-delete:hover {
            background: #ff5252;
        }

        .main {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 5px;
            color: #333;
        }

        input[type="text"],
        input[type="date"],
        textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
            flex: 1;
            min-width: 150px;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .btn-success {
            background: #51cf66;
            color: white;
        }

        .btn-success:hover {
            background: #40c057;
        }

        .alert {
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 13px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f0f0f0;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .content {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #e0e0e0;
                max-height: 300px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .diagnostic-buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">


        <div class="content">
            <div class="sidebar">
                <h3>Type de diagnostic</h3>
                <div class="diagnostic-buttons" id="diagnosticButtons"></div>

                <h3>Brouillons</h3>
                <input type="text" id="saveNom" class="save-input" placeholder="Nom du brouillon">
                <button class="btn-primary" onclick="saveBrouillon()" style="width: 100%; margin-bottom: 10px;">Sauvegarder</button>

                <div class="brouillons-list" id="brouillonsList"></div>
            </div>

            <div class="main">
                <div id="alerts"></div>

                <div class="form-grid">
                    {% for key, label in fields %}
                    <div class="form-group">
                        <label for="{{ key }}">{{ label }}</label>
                        <input type="text" id="{{ key }}" data-field="{{ key }}" placeholder="">
                    </div>
                    {% endfor %}
                </div>

                <div class="actions">
                    <button class="btn-primary" onclick="genererCAR()">Generer le CAR</button>
                    <button class="btn-secondary" onclick="clearForm()">Vider le formulaire</button>
                </div>

                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p style="margin-top: 10px;">Generation en cours...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const diagnosticTypes = {
            {% for key, info in diagnostic_types.items() %}
            "{{ key }}": { label: "{{ info.label }}", color: "{{ info.color }}" },
            {% endfor %}
        };

        let selectedDiagnostic = null;

        // Initialiser les boutons de diagnostic
        function initDiagnosticButtons() {
            const container = document.getElementById("diagnosticButtons");
            Object.entries(diagnosticTypes).forEach(([key, info]) => {
                const btn = document.createElement("button");
                btn.className = "diagnostic-btn";
                btn.textContent = info.label;
                btn.onclick = () => selectDiagnostic(key, btn);
                container.appendChild(btn);
            });
        }

        function selectDiagnostic(key, btn) {
            selectedDiagnostic = key;
            document.querySelectorAll(".diagnostic-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
        }

        // Charger la liste des brouillons
        function loadBrouillons() {
            fetch("/api/brouillons")
                .then(r => r.json())
                .then(data => {
                    const list = document.getElementById("brouillonsList");
                    list.innerHTML = "";
                    data.forEach(b => {
                        const div = document.createElement("div");
                        div.style.marginBottom = "8px";
                        div.innerHTML = `
                            <div class="brouillon-item titre" onclick="loadBrouillon('${b.nom}')" style="cursor: pointer;">
                                ${b.titre || b.nom}
                                <button class="btn-delete" onclick="deleteBrouillon('${b.nom}'); event.stopPropagation();">X</button>
                            </div>
                            <div class="brouillon-item date">${new Date(b.date * 1000).toLocaleString('fr-FR')}</div>
                            <div class="brouillon-item type">${diagnosticTypes[b.type]?.label || b.type}</div>
                        `;
                        list.appendChild(div);
                    });
                });
        }

        function loadBrouillon(nom) {
            fetch(`/api/brouillons/${nom}`)
                .then(r => r.json())
                .then(data => {
                    Object.entries(data).forEach(([key, value]) => {
                        if (key === "diagnostic_type") {
                            selectDiagnostic(value, document.querySelector(`.diagnostic-btn[data-type="${value}"]`));
                        } else {
                            const input = document.getElementById(key);
                            if (input && key !== "nom") {
                                input.value = value || "";
                            }
                        }
                    });
                    document.getElementById("saveNom").value = nom;
                    showAlert(`Brouillon "${nom}" charge`, "info");
                });
        }

        function saveBrouillon() {
            if (!selectedDiagnostic) {
                showAlert("Selectionner un type de diagnostic", "error");
                return;
            }

            const nom = document.getElementById("saveNom").value || `brouillon-${new Date().toISOString().slice(0, 10)}`;
            const fields = {};
            document.querySelectorAll("[data-field]").forEach(input => {
                fields[input.id] = input.value;
            });
            fields.nom = nom;
            fields.diagnostic_type = selectedDiagnostic;

            fetch("/api/brouillons", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(fields)
            })
                .then(r => r.json())
                .then(() => {
                    showAlert(`Brouillon "${nom}" sauvegarde`, "success");
                    loadBrouillons();
                });
        }

        function deleteBrouillon(nom) {
            if (confirm(`Supprimer le brouillon "${nom}" ?`)) {
                fetch(`/api/brouillons/${nom}`, { method: "DELETE" })
                    .then(() => {
                        showAlert("Brouillon supprime", "success");
                        loadBrouillons();
                    });
            }
        }

        function genererCAR() {
            const template = document.getElementById("template").value;
            if (!template) {
                showAlert("Veuillez selectionner un template", "error");
                return;
            }

            if (!selectedDiagnostic) {
                showAlert("Veuillez selectionner un type de diagnostic", "error");
                return;
            }

            const nom = (document.getElementById("reference_dossier").value || "dossier").replace(/[^a-zA-Z0-9-_]/g, "-");
            const fields = {};
            document.querySelectorAll("[data-field]").forEach(input => {
                if (input.value) fields[input.id] = input.value;
            });

            document.getElementById("loading").style.display = "block";

            fetch("/api/generer", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ template, diagnostic_type: selectedDiagnostic, nom_sortie: nom, fields })
            })
                .then(r => r.json())
                .then(data => {
                    document.getElementById("loading").style.display = "none";
                    if (data.error) {
                        showAlert(`Erreur: ${data.error}`, "error");
                    } else {
                        showAlert(`CAR genere: ${data.fichier}`, "success");
                        const a = document.createElement("a");
                        a.href = `/api/telecharger/${data.fichier}`;
                        a.download = data.fichier;
                        a.click();
                    }
                });
        }

        function clearForm() {
            if (confirm("Vider tout le formulaire ?")) {
                document.querySelectorAll("[data-field]").forEach(input => input.value = "");
                document.getElementById("saveNom").value = "";
                selectedDiagnostic = null;
                document.querySelectorAll(".diagnostic-btn").forEach(b => b.classList.remove("active"));
            }
        }

        function showAlert(msg, type) {
            const alerts = document.getElementById("alerts");
            const div = document.createElement("div");
            div.className = `alert alert-${type}`;
            div.textContent = msg;
            alerts.appendChild(div);
            setTimeout(() => div.remove(), 4000);
        }

        // Au chargement
        initDiagnosticButtons();
        loadBrouillons();
    </script>
</body>
</html>
