name: Build Windows EXE

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer dependances
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install Flask Werkzeug pyinstaller

      - name: Compiler le .exe
        run: |
          pyinstaller --onefile --noconsole --name WinDiag-CAR --add-data "templates;templates" --add-data "windiag_core.py;." --hidden-import flask --hidden-import werkzeug --hidden-import jinja2 --hidden-import click --hidden-import itsdangerous app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinDiag-CAR-Windows
          path: dist\WinDiag-CAR.exe
          retention-days: 30

      - name: Creer une Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "WinDiag CAR - Build ${{ github.run_number }}"
          body: |
            ## Utilisation
            1. Telecharger `WinDiag-CAR.exe`
            2. Creer un dossier `templates/` a cote du .exe
            3. Y placer vos fichiers .CAR de reference
            4. Double-cliquer sur `WinDiag-CAR.exe`
            5. Le navigateur s ouvre automatiquement sur http://127.0.0.1:5000
          files: dist\WinDiag-CAR.exe
          draft: false
          prerelease: false
